<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Developer Card — GitHub開発スタイル診断</title><link rel="stylesheet" href="styles.css?v=20260823-1359"></head><body><main class="shell"><section class="hero"><p class="eyebrow">GitHubでわかる</p><h1>開発スタイル診断</h1><p>GitHubを読み込んで、今の自分の開発スタイルを16:9カードに。</p></section><section class="panel"><label>ハンドルネーム<input id="handle" placeholder="未入力ならGitHub名を使用" maxlength="40" autocomplete="nickname"></label><label>表示画像<input id="avatar" type="file" accept="image/*"></label><label>GitHub URL / username<input id="github" placeholder="https://github.com/username"></label><button id="load">GitHubを読み込む</button><p id="status" aria-live="polite"></p></section><section id="repoStep" class="panel hidden"><h2>repoを選ぶ</h2><p>公開候補・評価のみ・除外を選べます。解析前にもう一度確認します。</p><div id="repos"></div><button id="confirm">このEvidenceで確認へ</button></section><dialog id="confirmDialog"><h2>解析前の最終確認</h2><p id="confirmText"></p><form method="dialog"><button value="cancel">戻る</button><button id="generate" value="default">Generate</button></form></dialog><section id="result" class="hidden"><div id="xcard" class="xcard"><div class="identity"><img id="cardAvatar" alt=""><div><small>GitHub開発スタイル診断</small><h2 id="cardHandle"></h2><p id="cardType"></p></div></div><div id="cardHighlights" class="stats"></div><div class="footer"><span>Developer Card FV</span><span>詳細解析でもっと掘れます →</span></div></div><div class="panel"><h2>無料サマリー</h2><div id="recommended"></div><h3>もう少し掘ると…</h3><ul id="curiosity"></ul><p class="note">ここに出ているのは候補シグナルです。Tech Radarや研究・事業化評価はまだ実行していません。</p><button id="download">16:9 Xカードを保存 / 共有</button><button id="share">X投稿用テキストを共有</button></div></section></main><script type="module" src="src/app.mjs?v=20260823-1359"></script></body></html>
