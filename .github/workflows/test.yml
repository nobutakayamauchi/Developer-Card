name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser modules
        run: |
          node --check src/app.mjs
          node --check src/evidence.mjs
          node --check src/evidence-panel.mjs
          node --check src/share-card.mjs
          node --check src/public-report.mjs
          node --check src/detail-report.mjs
          node --check src/mobile-memory-guard.mjs
      - run: node --test test/*.test.mjs
